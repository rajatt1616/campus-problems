{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error · CampusComplaint{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo-mark.svg' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="flex min-h-screen items-center justify-center bg-page px-4 font-sans text-ink">
    <main class="w-full max-w-[400px] text-center">
        <div class="mb-6 flex justify-center">
            <img src="{% static 'img/logo-mark.svg' %}" alt="CampusComplaint" class="h-12 w-12 rounded-lg">
        </div>
        <div class="text-xs font-semibold uppercase tracking-wider text-muted">{% block code %}Error{% endblock %}</div>
        <h1 class="mt-2 text-3xl font-bold text-ink">{% block heading %}Something went wrong{% endblock %}</h1>
        <p class="mt-3 text-base text-muted">{% block message %}Please try again.{% endblock %}</p>
        <div class="mt-6">
            <a href="{% url 'home' %}"
               class="inline-flex h-10 items-center rounded-lg bg-primary px-4 text-sm font-semibold text-white transition hover:bg-primary-hover">Go to dashboard</a>
        </div>
    </main>
</body>
</html>
